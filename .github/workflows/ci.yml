name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web lint / types / tests / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:web
      - run: npm run build:web

  worker:
    name: Worker lint / formatting / tests / smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: services/ai-worker/.python-version
      - run: python -m pip install -e '.[dev,rtc,tts]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Validate RU/VI test corpus and deterministic evaluator
        run: |
          python -m nastya_worker.evaluate validate
          python -m nastya_worker.evaluate baseline --output /tmp/nastya-eval-baseline.jsonl
          python -m nastya_worker.evaluate score --predictions /tmp/nastya-eval-baseline.jsonl --system source-copy-control --output /tmp/nastya-eval-report.json
      - name: Smoke remote translation benchmark against local MOCK server
        run: |
          python -m nastya_worker.mock_api > /tmp/nastya-mock.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          python -c 'import socket,time; [(time.sleep(0.1)) for _ in range(20) if socket.socket().connect_ex(("127.0.0.1",8765)) != 0]'
          NASTYA_MT_URL=http://127.0.0.1:8765/v1/translate python -m nastya_worker.benchmark_remote mt --models mock-small,mock-large --output-dir /tmp/nastya-remote-bench-smoke --concurrency 2 --rounds 1
          python -c 'import json; r=json.load(open("/tmp/nastya-remote-bench-smoke/mt-benchmark-report.json")); assert r["corpus_count"] == 120 and len(r["results"]) == 2 and all(v["succeeded"] == 120 for v in r["results"].values())'
      - name: Validate TTS CLI without external service
        run: python -m nastya_worker.tts_experiment --help
      - name: Validate LiveKit Python token generation and speaker isolation
        run: python -m nastya_worker --health
      - run: python -c 'from livekit import api,rtc; from nastya_worker.livekit_ingest import RoomAudioReceiver,worker_token; assert rtc.AudioStream and api.AccessToken and RoomAudioReceiver and worker_token'

  rtc:
    name: Local LiveKit / two-browser WebRTC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install locked web and Playwright test dependencies
        run: npm ci --no-audit --no-fund
      - name: Start local LiveKit SFU
        run: |
          docker run -d --rm --network host --name nastya-livekit-e2e \
            livekit/livekit-server:v1.13.7 --dev --bind 0.0.0.0
          for attempt in $(seq 1 45); do
            if curl --silent --max-time 2 --output /dev/null http://127.0.0.1:7880/; then
              exit 0
            fi
            sleep 2
          done
          docker logs nastya-livekit-e2e
          exit 1
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run synthetic two-client RTC acceptance suite
        run: npm run test:rtc
      - name: Install Python worker with native LiveKit RTC SDK
        run: |
          python3 -m pip install --break-system-packages -e 'services/ai-worker[rtc]'
      - name: Real SFU two-microphone interpreter ingress smoke
        run: |
          python3 services/ai-worker/tests/smoke_livekit_ingress.py
      - name: Real SFU targeted caption data smoke
        run: python3 services/ai-worker/tests/smoke_caption_data.py

      - name: Upload sanitized RTC report and Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtc-local-playwright
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop test SFU
        if: always()
        run: docker stop nastya-livekit-e2e || true
