name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web lint / types / tests / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:web
      - run: npm run build:web

  worker:
    name: Worker lint / formatting / tests / smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: services/ai-worker/.python-version
      - run: python -m pip install -e '.[dev]'
      - name: Bootstrap test file formatter for this PR
        run: |
          ruff format tests/test_remote_api.py
          base64 tests/test_remote_api.py | sed 's/^/FMT64:/'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m nastya_worker --health
