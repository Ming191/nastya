name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web lint / types / tests / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # NAS-2 initial bootstrap: once a lockfile is generated and committed,
      # replace npm install with npm ci + npm cache in this job.
      - run: npm install --no-audit --no-fund
      - name: Emit generated npm lockfile in CI logs (one-time bootstrap)
        run: base64 package-lock.json | sed 's/^/LOCK64:/'
      - run: npm run check:web
      - run: npm run build:web

  worker:
    name: Worker lint / formatting / tests / smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: services/ai-worker/.python-version
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m nastya_worker --health
