[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "nastya-ai-worker"
version = "0.1.0"
description = "Remote inference provider interfaces for Nastya RTC translation"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1,<0.29"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.3"]
rtc = ["livekit==1.1.20", "livekit-api==1.2.1"]

[project.scripts]
nastya-worker = "nastya_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
